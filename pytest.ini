[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: 冒烟测试（核心流程）
    regression: 回归测试（完整功能）
    login: 登录相关测试
    cart: 购物车相关测试
    checkout: 下单流程测试
